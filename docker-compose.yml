# MTG Market Simulator 单机部署编排。三服务共享同一镜像，通过不同 command/职责启动：
#   caddy —— 唯一对外入口（80/443），反代到 web:3000；有域名时自动 HTTPS，无域名时纯 HTTP。
#   web   —— Next.js 生产服务，监听 3000（容器内），经 rewrites 反向代理 /api → api:3001。
#   api   —— Fastify + SQLite，唯一经济结算入口，监听 3001（仅容器内网络）。
#
# 部署步骤、密钥生成与 Caddy 域名配置见 docs/deploy.md。敏感配置从 .env.docker 读取，切勿提交。

services:
  api:
    image: mtg-market-simulator
    build:
      context: .
      dockerfile: Dockerfile
    # 镜像默认 CMD 即启动 API，显式声明便于阅读。
    command: ["node", "apps/api/dist/server.js"]
    env_file: .env.docker
    environment:
      # 容器内固定：API 监听所有网卡，SQLite 写持久卷，前端走同站代理。
      PORT: "3001"
      APP_ENV: "production"
      SQLITE_PATH: "/app/data/market-simulator.db"
      CATALOG_DATA_DIR: "/app/data/catalog"
      # 备份与导出写入同一持久卷，重建容器不丢备份/导出与经济真相。
      BACKUP_DIR: "/app/data/backups"
      EXPORT_DIR: "/app/data/exports"
      # 代理模式下浏览器同源请求，CORS 白名单为本站自身。
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:80}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:80}"
    volumes:
      # SQLite、卡池、备份与导出持久化到命名卷，重建容器不丢经济真相与备份。
      - api-data:/app/data
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: mtg-market-simulator
    # 在 web 包目录内以生产模式启动 Next。
    working_dir: /app/apps/web
    command: ["pnpm", "exec", "next", "start", "-p", "3000", "-H", "0.0.0.0"]
    environment:
      # 代理模式：前端用相对路径 /api；Next 把 /api/* 转发到 api 服务。
      NEXT_PUBLIC_API_BASE_URL: "/api"
      API_PROXY_TARGET: "http://api:3001"
      NODE_ENV: "production"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # DOMAIN 为空（纯 IP 部署）时 Caddyfile 走 :80；有域名时自动签发 HTTPS 证书。
      DOMAIN: "${DOMAIN:-}"
    depends_on:
      - web

volumes:
  api-data:
  caddy-data:
  caddy-config:
